# Pokémon Splendor (璀璨宝石·宝可梦) — static game served under /splendor/
# 部署：sudo cp 本文件到 /opt/gem/nginx/splendor.conf 后执行
#   sudo nginx -c /opt/gem/nginx.conf -t && sudo nginx -s reload
location = /splendor {
    return 301 /splendor/;
}
location /splendor/ {
    alias /home/user/Doubao/chats/38449825031179778/pokemon-splendor/;
    index index.html;
    add_header Cache-Control "no-cache" always;
}
